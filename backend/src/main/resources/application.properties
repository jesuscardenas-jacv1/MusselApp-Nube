# Puerto y nombre del microservicio
server.port=8080
# Solo este computador: el teléfono llega por USB con "adb reverse"
server.address=127.0.0.1
spring.application.name=musselapp-backend

# Base de datos H2 persistente en archivo local (sobrevive reinicios sin instalar servidor externo)
spring.datasource.url=jdbc:h2:file:./data/musselapp;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: actualiza el esquema automáticamente (clave para modificaciones en vivo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola H2 para inspeccionar tablas en el navegador (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
